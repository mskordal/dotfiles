unbind r
bind r source-file ~/.tmux.conf

# colours the PS1 prompts
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# change prefix to ctrl-a instead of the default (ctrl-b)
set -g prefix C-x 

# Split panes with \ and -
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"' 
unbind '%'
set-option -g history-limit 20000

set -s escape-time 0

# in copy mode v selects, Ctrl-v alternates between box selection
# and y copies text and exits copy-mode.
setw -g mode-keys vi
set-option -s set-clipboard off 
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

set-option -g renumber-windows on
set -g status-position top
set-option -g default-command "$SHELL -l"


set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'maxpetretta/tmux-monokai-pro'
set -g @monokai-plugins "time battery cpu-usage ram-usage"

# set-option -g window-status-current-style 'fg=#24273a bg=#f5bde6 bold'
set-option -g window-status-current-style bold
run -b '~/.tmux/plugins/tpm/tpm'
